{# Expects `materials` (ordered by type, display_name - see MaterialPrice.query.order_by calls)
   in scope. Groups options into <optgroup>s by structural type (sheets/rods/profiles/...).
   The data-* attributes feed the page JS (kg, dimensions, owner filter) and the picker window of
   <select data-picker="material"> (static/js/entity_picker.js): data-grade / data-brand / data-t /
   data-owner-name are its filters and columns; data-stock / data-stock-kg (staff only - a customer
   never sees our stock) its "Наличност". data-owner stays the owner's id (page JS filters by it).
   No extra queries: grade is lazy-joined, owner_client is already read by format_material_option(). #}
{% for type_key, group in materials|groupby('type') %}
<optgroup label="{{ material_type_label(type_key) }}">
    {% for material in group %}
    <option value="{{ material.key }}" data-owner="{{ material.owner_client_id or '' }}" data-id="{{ material.id }}" data-name="{{ localized(material, 'display_name') }}"
            data-w="{{ material.sheet_width_mm if material.sheet_width_mm is not none else '' }}"
            data-h="{{ material.sheet_length_mm if material.sheet_length_mm is not none else '' }}"
            data-t="{{ material.thickness_mm if material.thickness_mm is not none else '' }}"
            data-density="{{ material_density(material) or '' }}" data-weight="{{ material.weight_kg or '' }}" data-hm="{{ material.height_mm or '' }}"
            data-type="{{ material.type }}" data-unit="{{ material_unit_short(material.type) }}" data-brand="{{ material.brand or '' }}"
            data-grade="{{ material.grade.name if material.grade else 'Без вид' }}" data-owner-name="{{ material.owner_client.name if material.owner_client else 'Трафком' }}"
            {% if current_user.is_staff %}data-stock="{{ (material.stock_quantity or 0)|num3 }}" data-stock-kg="{{ material_stock_kg(material)|num3 }}"{% endif %}
            data-price="{{ client_material_rate(material) }}">{{ format_material_option(material) }}</option>
    {% endfor %}
</optgroup>
{% endfor %}
