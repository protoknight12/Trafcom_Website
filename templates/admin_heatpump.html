<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'partials/favicon.html' %}
    <title>Термопомпа - TRAFCOM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .hp-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
        .hp-state { padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .state-online { background-color: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
        .state-offline { background-color: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
        .hp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .hp-card { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); padding: 12px 14px; }
        .hp-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
        .hp-value { font-size: 1.6rem; font-weight: 700; color: var(--text-main); }
        .hp-value small { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; }
        .hp-on { color: var(--success-text); }
        .hp-off { color: var(--text-muted); }
        .hp-fault { color: var(--danger-text); }
        .hp-chart { width: 100%; height: 260px; display: block; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); }
        .hp-legend { font-size: 0.8rem; margin: 8px 0 18px; display: flex; gap: 16px; flex-wrap: wrap; }
        .hp-legend i { display: inline-block; width: 12px; height: 3px; margin-right: 5px; vertical-align: middle; }
        .hp-section { margin: 22px 0 8px; }
    </style>
</head>
<body>
{% include 'partials/navbar.html' %}

<main class="admin-container" style="max-width: 1100px; margin: 30px auto; padding: 0 15px;">
    <div class="hp-head">
        <div>
            <h2 style="margin-bottom: 4px;">Термопомпа Heliotherm</h2>
            <p class="section-subtitle" style="margin: 0;">Данни на живо през RS-232 → Ethernet. Само отчитане. <span id="lastUpdate" class="text-muted"></span></p>
        </div>
        <span id="hpState" class="hp-state state-offline">Няма връзка</span>
    </div>
    <p id="hpError" class="text-muted text-small"></p>

    <h3 class="hp-section">Температури и налягане</h3>
    <div class="hp-grid" id="gridTemps"></div>

    <h3 class="hp-section">Състояние</h3>
    <div class="hp-grid" id="gridStates"></div>

    <h3 class="hp-section">История
        <select id="hoursSel" style="margin-left: 10px; padding: 3px 6px; background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px;">
            <option value="6">6 ч</option>
            <option value="24" selected>24 ч</option>
            <option value="72">3 дни</option>
            <option value="168">7 дни</option>
        </select>
    </h3>
    <canvas id="chart" class="hp-chart"></canvas>
    <div class="hp-legend" id="legend"></div>

    <h3 class="hp-section">Настройки на връзката</h3>
    <form action="{{ url_for('admin_heatpump_set_host') }}" method="POST" class="admin-form" style="max-width: 420px;">
        {% include 'partials/csrf_field.html' %}
        <div class="form-group">
            <label>Адрес на RS232→Ethernet конвертора (IP:порт)</label>
            <input type="text" name="host" value="{{ host }}" placeholder="192.168.18.123:23" maxlength="100">
        </div>
        <button type="submit" class="btn">Запази</button>
    </form>
</main>

<script>
(function () {
    var MODES = {{ modes|tojson }};
    var TEMPS = [
        ['Temp. Aussen', 'Външна', '°C'], ['Temp. Aussen verzoegert', 'Външна (забавена)', '°C'],
        ['Temp. Vorlauf', 'Подаване', '°C'], ['Temp. Ruecklauf', 'Връщане', '°C'],
        ['HKR_Sollwert', 'Зададено подаване', '°C'], ['Temp. Brauchwasser', 'Бойлер (БГВ)', '°C'],
        ['Temp. Frischwasser_Istwert', 'Прясна вода', '°C'],
        ['Temp. EQ_Eintritt', 'Източник вход', '°C'], ['Temp. EQ_Austritt', 'Източник изход', '°C'],
        ['Temp. Sauggas', 'Сауг газ', '°C'], ['Temp. Heissgas', 'Горещ газ', '°C'],
        ['Temp. Verdampfung', 'Изпарение', '°C'], ['Temp. Kondensation', 'Кондензация', '°C'],
        ['Niederdruck (bar)', 'Ниско налягане', 'bar'], ['Hochdruck (bar)', 'Високо налягане', 'bar']
    ];
    var BOOLS = [
        ['Verdichter', 'Компресор'], ['Heizkreispumpe', 'Помпа отопление'], ['EQ Pumpe (Ventilator)', 'Помпа източник'],
        ['Zirkulationspumpe WW', 'Циркулация БГВ'], ['Warmwasservorrang', 'Приоритет БГВ'],
        ['Hauptschalter', 'Главен ключ'], ['Stoerung', 'Авария']
    ];
    var SLOW = [
        ['Betriebsart', 'Режим', function (v) { return MODES[v] || v; }],
        ['HKR Soll_Raum', 'Стайна темп.', function (v) { return v + ' °C'; }],
        ['HKR Heizgrenze', 'Граница отопление', function (v) { return v + ' °C'; }],
        ['WW Normaltemp.', 'БГВ нормална', function (v) { return v + ' °C'; }],
        ['WW Minimaltemp.', 'БГВ минимална', function (v) { return v + ' °C'; }],
        ['BSZ Verdichter Betriebsst. ges', 'Моточасове компресор', function (v) { return v + ' ч'; }],
        ['BSZ Verdichter Betriebsst. WW', 'От тях за БГВ', function (v) { return v + ' ч'; }],
        ['BSZ Verdichter Betriebsst. HKR', 'От тях за отопление', function (v) { return v + ' ч'; }]
    ];
    var COLORS = {'Temp. Aussen': '#4aa3ff', 'Temp. Vorlauf': '#ff6b4a', 'Temp. Ruecklauf': '#f0b429', 'Temp. Brauchwasser': '#3ccf91'};
    var NAMES = {'Temp. Aussen': 'Външна', 'Temp. Vorlauf': 'Подаване', 'Temp. Ruecklauf': 'Връщане', 'Temp. Brauchwasser': 'Бойлер'};

    function card(label, valueHtml) {
        return '<div class="hp-card"><div class="hp-label">' + label + '</div><div class="hp-value">' + valueHtml + '</div></div>';
    }
    function num(v, unit) { return v == null ? '<small>—</small>' : v + ' <small>' + unit + '</small>'; }

    function render(r) {
        var st = document.getElementById('hpState');
        st.textContent = r.online ? 'Свързана' : 'Няма връзка';
        st.className = 'hp-state ' + (r.online ? 'state-online' : 'state-offline');
        document.getElementById('hpError').textContent = r.online ? '' : (r.error || '');
        if (r.ts) document.getElementById('lastUpdate').textContent = 'Обновено: ' + new Date(r.ts * 1000).toLocaleTimeString('bg-BG');
        var d = r.data || {}, s = r.slow || {};
        if (!Object.keys(d).length) return;
        document.getElementById('gridTemps').innerHTML = TEMPS.map(function (t) { return card(t[1], num(d[t[0]], t[2])); }).join('');
        var html = BOOLS.map(function (b) {
            var on = !!d[b[0]], bad = b[0] === 'Stoerung';
            return card(b[1], '<span class="' + (on ? (bad ? 'hp-fault' : 'hp-on') : 'hp-off') + '">' + (on ? (bad ? 'ДА' : 'Вкл.') : (bad ? 'Не' : 'Изкл.')) + '</span>');
        }).join('');
        html += SLOW.filter(function (x) { return s[x[0]] != null; })
            .map(function (x) { return card(x[1], '<span style="font-size:1.15rem">' + x[2](s[x[0]]) + '</span>'); }).join('');
        if (s.last_fault) {
            html += card('Последна авария (' + s.fault_count + ' записа)',
                '<span style="font-size:0.95rem">' + s.last_fault.text + '<br><small>' + new Date(s.last_fault.ts).toLocaleString('bg-BG') + '</small></span>');
        }
        document.getElementById('gridStates').innerHTML = html;
    }

    function poll() {
        fetch('{{ url_for("admin_heatpump_data") }}').then(function (r) { return r.json(); }).then(render).catch(function () {});
    }

    function drawChart() {
        var hours = document.getElementById('hoursSel').value;
        fetch('{{ url_for("admin_heatpump_history") }}?hours=' + hours).then(function (r) { return r.json(); }).then(function (series) {
            var cv = document.getElementById('chart'), dpr = window.devicePixelRatio || 1;
            var w = cv.clientWidth, h = cv.clientHeight;
            cv.width = w * dpr; cv.height = h * dpr;
            var c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, w, h);
            var pts = [], keys = Object.keys(series);
            keys.forEach(function (k) { series[k].forEach(function (p) { if (p[1] != null) pts.push(p); }); });
            if (!pts.length) { c.fillStyle = '#888'; c.fillText('Още няма записана история.', 14, 24); return; }
            var t0 = Math.min.apply(null, pts.map(function (p) { return p[0]; })), t1 = Math.max.apply(null, pts.map(function (p) { return p[0]; }));
            var lo = Math.min.apply(null, pts.map(function (p) { return p[1]; })), hi = Math.max.apply(null, pts.map(function (p) { return p[1]; }));
            lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
            var L = 38, B = 20, T = 8, R = 8;
            function X(t) { return L + (t - t0) / Math.max(1, t1 - t0) * (w - L - R); }
            function Y(v) { return T + (hi - v) / (hi - lo) * (h - T - B); }
            c.font = '11px sans-serif'; c.fillStyle = '#888'; c.strokeStyle = 'rgba(128,128,128,.25)';
            var step = Math.max(1, Math.round((hi - lo) / 5));
            for (var v = lo; v <= hi; v += step) { c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(w - R, Y(v)); c.stroke(); c.fillText(v, 4, Y(v) + 4); }
            for (var i = 0; i <= 4; i++) {
                var t = t0 + (t1 - t0) * i / 4;
                c.fillText(new Date(t * 1000).toLocaleTimeString('bg-BG', {hour: '2-digit', minute: '2-digit'}), X(t) - 14, h - 5);
            }
            keys.forEach(function (k) {
                c.strokeStyle = COLORS[k]; c.lineWidth = 1.8; c.beginPath();
                var started = false;
                series[k].forEach(function (p) {
                    if (p[1] == null) { started = false; return; }
                    if (started) c.lineTo(X(p[0]), Y(p[1])); else { c.moveTo(X(p[0]), Y(p[1])); started = true; }
                });
                c.stroke();
            });
            document.getElementById('legend').innerHTML = keys.map(function (k) {
                return '<span><i style="background:' + COLORS[k] + '"></i>' + NAMES[k] + '</span>';
            }).join('');
        });
    }

    document.getElementById('hoursSel').addEventListener('change', drawChart);
    poll(); setInterval(poll, 3000);
    drawChart(); setInterval(drawChart, 60000);
})();
</script>
</body>
</html>
