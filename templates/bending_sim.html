<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D симулация - {{ title }}</title>
    <style>
        html, body { margin: 0; height: 100%; background: #14171a; color: #cfd8e0; font-family: Arial, sans-serif; overflow: hidden; }
        .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1d2126; border-bottom: 1px solid #2c333a; flex-wrap: wrap; height: 30px; }
        .bar button, .bar select { background: #2c333a; color: #e8eef3; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .bar button:hover { background: #3a444d; }
        .bar .info { margin-left: auto; font-size: 13px; color: #9aa5b1; }
        #view { position: absolute; top: 46px; bottom: 0; left: 0; right: 0; }
        #warn { position: absolute; left: 12px; top: 58px; background: rgba(255,59,48,.9); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 14px; display: none; }
        #elements { position: absolute; right: 8px; top: 58px; width: 230px; max-height: calc(100% - 80px); overflow: auto; background: rgba(29,33,38,.92); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
        #elements .grp { margin: 8px 0 3px; color: #9aa5b1; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
        #elements label { display: block; padding: 2px 0; cursor: pointer; }
        #elements .row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        #elements .row button { background: #2c333a; color: #e8eef3; border: 0; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        #label { position: absolute; left: 12px; bottom: 10px; font-size: 14px; background: rgba(20,23,26,.85); padding: 6px 10px; border-radius: 6px; }
    </style>
    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div class="bar">
        <button type="button" id="play">&#9208; Пауза</button>
        <button type="button" id="prev">&larr;</button>
        <select id="step"></select>
        <button type="button" id="next">&rarr;</button>
        <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
        <span class="info">влачене = въртене, колело = мащаб, дясно влачене = преместване{% if skipped %} · пропуснати стъпки без инструменти: {{ skipped }}{% endif %}</span>
    </div>
    <div id="view"></div>
    <div id="elements">
        <div class="grp" style="margin-top:0">Изглед</div>
        <div class="row"><button type="button" id="v_tool">Инструмент</button><button type="button" id="v_all">Машина</button><button type="button" id="v_front">Отпред</button><button type="button" id="v_side">Отстрани</button><button type="button" id="v_top">Отгоре</button></div>
        <div class="grp">Показвай</div>
        <div class="row"><button type="button" id="p_all">Всичко</button><button type="button" id="p_tools">Само процеса</button><button type="button" id="p_back">+ заден упор</button><button type="button" id="p_mach">Само машината</button></div>
    </div>
    {% if spec %}
    <table id="spec" style="position:absolute;left:12px;top:58px;background:rgba(29,33,38,.92);border-radius:8px;padding:8px 10px;font-size:13px;border-collapse:collapse">
        <tr><th colspan="2" style="text-align:left;padding-bottom:4px">{{ title }}</th></tr>
        {% for a, b in spec %}<tr><td style="color:#9aa5b1;padding:2px 12px 2px 0">{{ a }}</td><td>{{ b }}</td></tr>{% endfor %}
    </table>
    {% endif %}
    <div id="warn" {% if spec %}style="top:auto;bottom:50px"{% endif %}></div>
    <div id="label"></div>
    <script type="application/json" id="simdata">{{ sim|tojson }}</script>
    <script type="module" src="{{ url_for('static', filename='js/bend_sim.js') }}"></script>
</body>
</html>
