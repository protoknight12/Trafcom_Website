<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'partials/favicon.html' %}
    <title>Грешка {{ code }} - Trafcom DXF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .error-container {
            max-width: 560px;
            margin: 100px auto;
            padding: 0 24px;
            text-align: center;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--accent-primary);
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 12px 0 8px;
        }
        .error-message {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
{% include 'partials/navbar.html' %}

<main class="error-container">
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-message">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn-submit" style="padding: 12px 24px; border-radius: var(--border-radius-sm); text-decoration: none; display: inline-block;">Към началото</a>
</main>

</body>
</html>
