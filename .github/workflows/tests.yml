name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # deploy/constraints.txt = the versions pinned on the production server (optional)
          C=""
          if [ -f deploy/constraints.txt ]; then C="-c deploy/constraints.txt"; fi
          pip install -r requirements.txt -r requirements-dev.txt $C
      # No apt packages: the ubuntu-latest image already has libgl1 / libglib2.0-0 / libX11 that OCP may link.
      # If the first run fails with "libGL.so.1: cannot open shared object file", add:
      #   sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Run all tests (one process per file, SQLite)
        run: python -m testing.run_all
