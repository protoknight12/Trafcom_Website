server {
    listen 80;
    server_name trafcombg.com www.trafcombg.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live camera video: browser -> nginx -> go2rtc (127.0.0.1:1984), allowed only for a logged-in admin (Flask answers 204/401).
    # Only the MJPEG / JPEG endpoints of cameras registered by the app (src=cam<id>) are reachable; go2rtc's own API and UI are not.
    location = /camauth {
        internal;
        proxy_pass http://127.0.0.1:8000/admin/cameras/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }
    location ~ ^/camstream/api/(stream\.mjpeg|frame\.jpeg)$ {
        auth_request /camauth;
        if ($arg_src !~ "^cam[0-9]+$") { return 403; }
        rewrite ^/camstream/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1984;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
