server {
    listen 80;
    server_name trafcombg.com www.trafcombg.com;

    client_max_body_size 20M;

    # text assets and JSON API answers shrink a lot on the wire (html is on by default)
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # dossier file uploads (backups) - the app itself caps these at 1 GB
    location ~ ^/admin/hall/[0-9]+/files$ {
        client_max_body_size 1G;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static files straight from disk, no gunicorn worker involved. URLs carry ?v=<mtime> (app.py _static_cache_bust), so a changed
    # file gets a new URL and the old one can be cached for good. static/uploads/ (product / offer / panel images) is plain static
    # in the app too - no route, no login check - and its names are uuid-prefixed and never overwritten, so it needs no exception.
    location /static/ {
        alias /opt/trafcom/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # gunicorn's timeout is 120 s; nginx's default 60 s cut long history queries with a 504 while the worker kept running
        proxy_read_timeout 130s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live camera video: browser -> nginx -> go2rtc (127.0.0.1:1984), allowed only for a logged-in admin (Flask answers 204/401).
    # Only the MJPEG / JPEG endpoints of cameras registered by the app (src=cam<id>) are reachable; go2rtc's own API and UI are not.
    location = /camauth {
        internal;
        proxy_pass http://127.0.0.1:8000/admin/cameras/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }
    location ~ ^/camstream/api/(stream\.mjpeg|frame\.jpeg)$ {
        auth_request /camauth;
        if ($arg_src !~ "^cam[0-9]+$") { return 403; }
        rewrite ^/camstream/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1984;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
